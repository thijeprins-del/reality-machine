<title>World Gallery</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: masthead + control strip, run summary, then a grid of world plates (map with the otter standing on it, facts below). Click a plate for the full dossier. Dark industrial like the mice, neon only as accent. */
:root{color-scheme:dark;--bg:#101215;--panel:#181b20;--panel2:#1f2329;--line:#2b3037;--fg:#e8e5dc;--dim:#8e929a;--neon:#4ef2ff;--warn:#ff9a3c;--bad:#ff5a4a;--ok:#8ee06a;--chip:#2a2f37;--font:'Space Grotesk',system-ui,sans-serif;--mono:ui-monospace,'JetBrains Mono',Menlo,monospace}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){color-scheme:light;--bg:#e9e7e1;--panel:#f8f7f3;--panel2:#efede6;--line:#cdcac0;--fg:#1c1e22;--dim:#666a72;--neon:#007f90;--warn:#b25500;--bad:#c0392b;--ok:#2f7d17;--chip:#e2e0d8}}
:root[data-theme="light"]{color-scheme:light;--bg:#e9e7e1;--panel:#f8f7f3;--panel2:#efede6;--line:#cdcac0;--fg:#1c1e22;--dim:#666a72;--neon:#007f90;--warn:#b25500;--bad:#c0392b;--ok:#2f7d17;--chip:#e2e0d8}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.mast{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:end;justify-content:space-between}
.eyebrow{font:.7rem var(--mono);letter-spacing:.2em;color:var(--neon);text-transform:uppercase}
h1{font-size:clamp(1.8rem,4.2vw,2.8rem);line-height:1;margin:6px 0 8px;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--dim);margin:0;max-width:62ch;line-height:1.55;font-size:.92rem}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:.66rem;text-transform:uppercase;letter-spacing:.12em;color:var(--dim)}
input{background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:9px 10px;font-family:var(--mono);width:10ch;border-radius:0}
button{background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:9px 14px;font:inherit;font-size:.9rem;cursor:pointer;border-radius:0}
button:hover{border-color:var(--neon)}button[aria-pressed=true]{border-color:var(--neon);color:var(--neon)}
button:focus-visible,input:focus-visible,.plate:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.sum>div{background:var(--panel);padding:10px 12px;min-width:0}
.sum b{display:block;font:600 1.35rem var(--font);font-variant-numeric:tabular-nums}
.sum span{font-size:.64rem;text-transform:uppercase;letter-spacing:.12em;color:var(--dim)}
.bars{display:flex;height:6px;margin-top:6px;gap:2px}.bars i{display:block;height:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}
.plate{background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0;cursor:pointer;text-align:left;padding:0;color:inherit}
.plate:hover{border-color:var(--neon)}
.map{position:relative;aspect-ratio:3/2;overflow:hidden;background:#000;border-bottom:1px solid var(--line)}
.map canvas.m{width:100%;height:100%;display:block;image-rendering:pixelated}
.map canvas.o{position:absolute;right:8px;bottom:0;image-rendering:pixelated;filter:drop-shadow(0 3px 0 rgba(0,0,0,.55))}
.tag{position:absolute;left:8px;top:8px;font:.62rem var(--mono);background:rgba(8,9,10,.78);color:#dfe1e4;padding:3px 7px;letter-spacing:.1em}
.body{padding:12px 13px 13px;display:flex;flex-direction:column;gap:9px}
.name{font-size:1.12rem;font-weight:600;margin:0;overflow-wrap:anywhere;text-wrap:balance}
.meta{font-size:.7rem;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;line-height:1.4}
.k{font-size:.6rem;text-transform:uppercase;letter-spacing:.14em;color:var(--dim);margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font:.7rem var(--mono);padding:2px 7px;background:var(--chip);border:1px solid var(--line);display:inline-flex;gap:5px;align-items:center}
.chip i{width:8px;height:8px;display:inline-block}
.chip.u{border-color:var(--neon);color:var(--neon);background:transparent}
.chip.no{opacity:.4;text-decoration:line-through}
.fit{display:flex;align-items:center;gap:8px;font-size:.78rem}
.pill{font:600 .64rem var(--mono);letter-spacing:.1em;padding:3px 8px;text-transform:uppercase;border:1px solid}
.pill.g{color:var(--ok);border-color:var(--ok)}.pill.y{color:var(--warn);border-color:var(--warn)}.pill.r{color:var(--bad);border-color:var(--bad)}
.rule{font-size:.76rem;color:var(--warn)}
.wr{height:7px;background:var(--bg);border:1px solid var(--line);display:flex}.wr i{display:block;height:100%}
.ov{position:fixed;inset:0;background:rgba(5,6,8,.78);z-index:20;display:none;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.ov.on{display:block}
.dos{max-width:980px;margin:20px auto;background:var(--panel);border:1px solid var(--neon);display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.dos .map{aspect-ratio:3/2;border:0}.dos .l{border-right:1px solid var(--line)}
.dos .r{padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.dos .big{padding:14px 16px;border-top:1px solid var(--line);display:grid;gap:12px}
.dos h2{font-size:1.5rem;margin:0}
.x{position:absolute;right:8px;top:8px;z-index:2}
table{border-collapse:collapse;width:100%;font-size:.8rem}td{padding:5px 6px;border-top:1px solid var(--line);vertical-align:top}td:first-child{color:var(--dim);width:34%}
@media(max-width:720px){.dos{grid-template-columns:1fr}.dos .l{border-right:0}}
</style>
<div class="wrap">
<div class="mast">
<div><div class="eyebrow">Reality Machine · procedural worlds</div><h1>World Gallery</h1>
<p class="sub">Every shift drops your disc into a world the generator rolls from the run seed. Each plate shows the land, who lives there (as otters), what you can take, and whether the mice factory can run on it. Click a plate for the full dossier.</p></div>
<div class="bar">
<label for="seed">Seed<input id="seed" inputmode="numeric" value="42"></label>
<button id="roll">Roll new seed</button>
<button id="vRun" aria-pressed="true">12 shifts in a row</button>
<button id="vAll" aria-pressed="false">One of each type</button>
</div></div>
<div class="sum" id="sum"></div>
<div class="grid" id="grid"></div>
</div>
<div class="ov" id="ov" role="dialog" aria-modal="true" aria-label="World dossier"></div>
<script>

</script>
<script>
const {genereerRun,genereerDimensie,ARCHETYPES,DIMENSIES}=LAND;
const NAME={steentijd:'Stone age',oudheid:'Antiquity',middeleeuwen:'Medieval',industrieel:'Industrial',modern:'Modern',scifi:'Sci-fi',insecten:'Bugs',monsters:'Monsters',kuddes:'Hordes',reuzen:'Giants',aliens:'Aliens',tentakelbeest:'Tentacle beast'};
const OTTER={steentijd:'Otter spear-bearer',oudheid:'Otter legionary',middeleeuwen:'Otter knight',industrieel:'Otter engineer',modern:'Otter soldier',scifi:'Otter trooper',insecten:'Hive otter',monsters:'Monster otter',kuddes:'Otter herder',reuzen:'Giant monster otter',aliens:'Alien otter',tentakelbeest:'Tentacle otter'};
const FAM={beschaving:'Civilization',wildernis:'Wildlife',bijzonder:'Special'};
const FAMC={beschaving:'#d0a050',wildernis:'#6aa860',bijzonder:'#b070e0'};
const RES={metaal:['metal','#9aa2a8'],hout:['wood','#a8743c'],water:['water','#3f86c8'],steen:['stone','#c2b08a']};
const ALL=Object.keys(NAME);
const CLIM=Object.fromEntries(DIMENSIES.map(d=>[d.tegelset,d]));
let view='run',list=[];
// ---- vaste ruis ----
const mulberry=a=>()=>{a=(a+0x6d2b79f5)>>>0;let t=Math.imul(a^a>>>15,a|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296};
const hash=(x,y,s)=>{let h=Math.imul(x*374761393+y*668265263+s*1442695041,2246822519);h^=h>>>13;h=Math.imul(h,3266489917);return((h^h>>>16)>>>0)/4294967296};
const vnoise=(x,y,s)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hash(xi,yi,s),b=hash(xi+1,yi,s),c=hash(xi,yi+1,s),d=hash(xi+1,yi+1,s);return(a+(b-a)*u)*(1-v)+(c+(d-c)*u)*v};
const rgb=n=>[(n>>16)&255,(n>>8)&255,n&255];
// ---- sprites: bijsnijden tot de figuur ----
const SP={};const spReady=Promise.all(Object.entries(SPRITES).map(([k,u])=>new Promise(res=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const g=c.getContext('2d');g.drawImage(im,0,0);const d=g.getImageData(0,0,c.width,c.height).data;let x0=c.width,y0=c.height,x1=0,y1=0;for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++)if(d[(y*c.width+x)*4+3]>20){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;o.getContext('2d').drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);SP[k]=o;res()};im.onerror=res;im.src=u})));
function paintOtter(cv,k,scale){const s=SP[k];if(!s)return;cv.width=s.width;cv.height=s.height;cv.style.width=s.width*scale+'px';cv.style.height=s.height*scale+'px';cv.getContext('2d').drawImage(s,0,0)}
// ---- de kaart ----
function drawMap(cv,d,W,H){
 cv.width=W;cv.height=H;const g=cv.getContext('2d'),im=g.createImageData(W,H),c=CLIM[d.klimaat],hv=c.heuvels;
 const sc=Math.max(3,hv.schaal*W/d.kaart[0]*1.6),seed=d.seed&0xffff,grond=c.grond.map(rgb),water=c.water.map(rgb),vlek=rgb(c.vlek);
 const hgt=new Float32Array(W*H);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const n=vnoise(x/sc,y/sc,seed)*0.65+vnoise(x/(sc/2.4),y/(sc/2.4),seed+9)*0.35;let h=(n-0.5)*hv.hoog+hv.basis*0.45;const rx=(x-W/2)/(W/2),ry=(y-H/2)/(H/2);if(Math.hypot(rx*1.5,ry)<0.3)h=Math.max(h,0.2);hgt[y*W+x]=h}
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const i=y*W+x,h=hgt[i],rx=(x-W/2)/(W/2),ry=(y-H/2)/(H/2),dist=Math.hypot(rx*1.5,ry);let col;
  if(h<-0.5&&dist>0.32){const k=0.8+0.2*vnoise(x/2,y/2,seed+3);col=water[(x+y*2)%water.length].map(v=>v*k)}
  else{col=grond[Math.floor(hash(x>>1,y>>1,seed)*grond.length)%grond.length];
   const hx=hgt[Math.min(W-1,x+1)+y*W]-hgt[Math.max(0,x-1)+y*W],hy=hgt[x+Math.min(H-1,y+1)*W]-hgt[x+Math.max(0,y-1)*W];
   const sh=1+Math.max(-.35,Math.min(.35,(-hx-hy)*0.5)),t=(0.62+0.38*Math.min(1,Math.max(0,(h+0.5)/4)))*sh;col=col.map(v=>v*t);
   if(hash(x,y,seed+5)<c.vlekKans*0.7)col=vlek}
  const o=i*4,v=1-0.28*Math.pow(Math.hypot(rx,ry)/1.2,2.4);im.data[o]=col[0]*v;im.data[o+1]=col[1]*v;im.data[o+2]=col[2]*v;im.data[o+3]=255}
 g.putImageData(im,0,0);
 const r=mulberry(d.seed),sites=[];
 for(let k=0;k<d.sites;k++){const a=(k/d.sites+r()*0.12)*Math.PI*2,e=0.5+r()*0.42;sites.push([W/2+Math.cos(a)*e*W*0.46,H/2+Math.sin(a)*e*H*0.44,5+r()*5])}
 const px=W/96; // een veld = kleine groepjes stippen: neutraal rond de ring (arm), rijk bij sites
 const fields=[...d.aanbod];
 fields.forEach((a,fi)=>{const col=RES[a.goed]?RES[a.goed][1]:'#4ef2ff',n=Math.max(2,Math.round(2+a.gewicht*1.6));
  for(let j=0;j<n;j++){const si=sites[(fi+j)%sites.length],near=j%3===0;let x,y;
   if(near){const an=r()*6.28,e=0.22+r()*0.1;x=W/2+Math.cos(an)*e*W*0.5;y=H/2+Math.sin(an)*e*H*0.5}
   else{const an=r()*6.28,e=r()*si[2]*px*0.9;x=si[0]+Math.cos(an)*e;y=si[1]+Math.sin(an)*e*0.6}
   g.fillStyle='rgba(0,0,0,.55)';g.fillRect(Math.round(x)-1*px,Math.round(y)-px,3*px,3*px);g.fillStyle=col;g.fillRect(Math.round(x)-px/2,Math.round(y)-px/2,2*px,2*px)}});
 sites.forEach(([x,y,rr])=>{g.strokeStyle='rgba(255,80,60,.7)';g.lineWidth=Math.max(1,px*.7);g.beginPath();g.ellipse(x,y,rr*px*1.25,rr*px*.8,0,0,7);g.stroke();g.fillStyle='rgba(255,60,40,.14)';g.fill();g.fillStyle='#ff4632';g.fillRect(Math.round(x)-px,Math.round(y)-px,3*px,3*px)});
 g.strokeStyle='#ffd23c';g.lineWidth=Math.max(1,px*.7);g.setLineDash([2*px,2*px]);g.beginPath();g.ellipse(W/2,H/2,11*px,7*px,0,0,7);g.stroke();g.setLineDash([]);
 g.fillStyle='#3c3f3e';g.fillRect(W/2-4*px,H/2-2.5*px,8*px,5*px);g.fillStyle='#1c1e1e';g.fillRect(W/2-4*px,H/2+1.5*px,8*px,1*px);g.fillStyle='#4ef2ff';g.fillRect(W/2-1*px,H/2-1*px,2*px,2*px);
}
// ---- fabriek-fit: wat kunnen de muizen hier draaien? (getallen uit src/data/muizen.ts) ----
function fit(d){
 const has=k=>d.aanbod.some(a=>a.goed===k),M=has('metaal'),H=has('hout');
 const rows=[['Wheel (mice run in it)',true,'No fuel needed, always works'],['Wood burner',H,H?'Burns wood from the stock':'Needs wood, none here'],['Dynamo',M,M?'Burns metal':'Needs metal, none here'],['Plates (belts, drills)',M,M?'2 metal become 2 plates':'No metal to press'],['Beams (poles, stockpiles, drills)',H,H?'2 wood become 1 beam':'No wood to saw'],['Drills and fabricators',M&&H,M&&H?'Plate + beam available':'Needs both plates and beams']];
 const n=rows.filter(r=>r[1]).length;let lvl,txt;
 if(M&&H){lvl='g';txt='Full factory'}else if(M||H){lvl='y';txt=M?'Half factory: no wood':'Half factory: no metal'}else{lvl='r';txt='Stock only: no metal, no wood'}
 const tip=M&&H?'Everything the mice know runs here.':(M||H)?'No drills or fabricators from local resources. Live off the starting stock (40 metal, 40 wood) or find a substitute in loot.':'The mice can only run the wheel and spend the starting stock. Look to the unique resources and loot plans.';
 return {rows,lvl,txt,tip,n};
}
function wrathBar(w){const seg=[[20,'#5a8a4a'],[20,'#b8b040'],[25,'#e08a30'],[25,'#e0502a'],[10,'#a01020']];let left=w,out='';for(const [len,col] of seg){const f=Math.max(0,Math.min(len,left));left-=len;out+=`<i style="width:${len}%;background:linear-gradient(90deg,${col} ${f/len*100}%,transparent ${f/len*100}%)"></i>`}return out}
function wrathName(w){return w<20?'Calm':w<40?'Watchful':w<65?'Angry':w<90?'Furious':'Cataclysm'}
const chips=(d)=>{const sh=d.aanbod.filter(a=>RES[a.goed]).map(a=>`<span class="chip"><i style="background:${RES[a.goed][1]}"></i>${RES[a.goed][0]}</span>`).join('');const no=Object.keys(RES).filter(k=>!d.aanbod.some(a=>a.goed===k)).map(k=>`<span class="chip no">${RES[k][0]}</span>`).join('');return sh+no};
const uq=d=>d.uniek.map(u=>`<span class="chip u">${u.naam}</span>`).join('');
function plate(d,i){const f=fit(d),A=ARCHETYPES[d.archetype];
 return `<button class="plate" data-i="${i}" aria-label="Open dossier of ${d.naam}"><div class="map"><canvas class="m" id="m${i}"></canvas><canvas class="o" id="o${i}"></canvas><span class="tag">SHIFT ${d.nummer} · ${d.klimaat.toUpperCase()} · ${d.kaart[0]}×${d.kaart[1]}</span></div><div class="body">
 <h2 class="name">${d.naam}</h2><div class="meta"><span style="color:${FAMC[d.familie]}">${FAM[d.familie]}</span> · ${NAME[d.archetype]} · ${d.sites} native sites</div>
 <div class="fit"><span class="pill ${f.lvl}">${f.txt}</span></div>
 <div><div class="k">Shared resources</div><div class="chips">${chips(d)}</div></div>
 <div><div class="k">Only here</div><div class="chips">${uq(d)}</div></div>
 ${d.regel?`<div class="rule">Rule: ${d.regel}</div>`:''}
 <div><div class="k">Wrath at landing · ${d.beginWrath} ${wrathName(d.beginWrath)}</div><div class="wr">${wrathBar(d.beginWrath)}</div></div></div></button>`}
function dossier(d,i){const f=fit(d),A=ARCHETYPES[d.archetype];
 return `<div class="dos"><div class="l"><div class="map" style="aspect-ratio:3/2"><canvas class="m" id="dm"></canvas><canvas class="o" id="do"></canvas><span class="tag">SHIFT ${d.nummer} · ${d.klimaat.toUpperCase()} · ${d.kaart[0]}×${d.kaart[1]} · seed ${d.seed}</span></div>
 <div class="big"><div class="k">Map key</div><div class="chips"><span class="chip"><i style="background:#ffd23c"></i>your disc and transport ring</span><span class="chip"><i style="background:#ff4632"></i>native site and territory</span><span class="chip"><i style="background:#9aa2a8"></i>resource field</span></div></div></div>
 <div class="r"><button class="x" id="cl">Close</button><div class="meta"><span style="color:${FAMC[d.familie]}">${FAM[d.familie]}</span> · ${NAME[d.archetype]}</div><h2>${d.naam}</h2>
 <table><tr><td>You see</td><td>${A.ziet}</td></tr><tr><td>It fights back with</td><td>${A.vecht}</td></tr><tr><td>Its otters</td><td>${OTTER[d.archetype]}</td></tr><tr><td>Native strength</td><td>×${d.sterkte} (${d.sites} sites)</td></tr>${d.regel?`<tr><td>Shift rule</td><td style="color:var(--warn)">${d.regel}</td></tr>`:''}</table>
 <div><div class="k">Shared resources (at least two always exist)</div><div class="chips">${chips(d)}</div></div>
 <div><div class="k">Only in this world</div><div class="chips">${uq(d)}</div></div>
 <div><div class="k">Loot plans (tech comes only from loot)</div><table>${d.loot.map(l=>`<tr><td>${l.vondst}</td><td>${l.vereist?'needs '+(d.uniek.find(u=>u.id===l.vereist)||{naam:l.vereist}).naam:'no special resource'}</td></tr>`).join('')}</table></div>
 <div><div class="k">Can the mice factory run here?</div><div class="fit"><span class="pill ${f.lvl}">${f.txt}</span></div><table>${f.rows.map(r=>`<tr><td>${r[0]}</td><td style="color:var(--${r[1]?'ok':'bad'})">${r[1]?'yes':'no'} · <span style="color:var(--dim)">${r[2]}</span></td></tr>`).join('')}</table><p class="sub" style="font-size:.8rem;margin-top:6px">${f.tip}</p></div>
 <div><div class="k">Wrath at landing · ${d.beginWrath} ${wrathName(d.beginWrath)}</div><div class="wr">${wrathBar(d.beginWrath)}</div></div></div></div>`}
function summary(){
 const fam={beschaving:0,wildernis:0,bijzonder:0},res={metaal:0,hout:0,water:0,steen:0};let half=0,none=0,rules=0;
 list.forEach(d=>{fam[d.familie]++;d.aanbod.forEach(a=>RES[a.goed]&&res[a.goed]++);const f=fit(d);if(f.lvl==='y')half++;if(f.lvl==='r')none++;if(d.regel)rules++});
 const n=list.length,bar=Object.entries(fam).map(([k,v])=>`<i style="width:${v/n*100}%;background:${FAMC[k]}"></i>`).join('');
 document.getElementById('sum').innerHTML=`<div><b>${n}</b><span>worlds</span><div class="bars">${bar}</div></div><div><b>${new Set(list.map(d=>d.archetype)).size}</b><span>different types</span></div><div><b>${new Set(list.map(d=>d.klimaat)).size}</b><span>climates</span></div><div><b>${Object.entries(res).map(([k,v])=>RES[k][0][0].toUpperCase()+v).join(' ')}</b><span>worlds with metal, wood, water, stone</span></div><div><b>${half+none}</b><span>worlds the factory struggles in</span></div><div><b>${rules}</b><span>with a shift rule</span></div>`}
function draw(){
 const seed=parseInt(document.getElementById('seed').value,10)||0;
 list=view==='run'?genereerRun(seed,12):ALL.map((a,i)=>genereerDimensie(seed,i+1,{archetype:a}));
 document.getElementById('grid').innerHTML=list.map(plate).join('');
 list.forEach((d,i)=>{drawMap(document.getElementById('m'+i),d,192,128);paintOtter(document.getElementById('o'+i),d.archetype,d.archetype==='reuzen'||d.archetype==='tentakelbeest'||d.archetype==='monsters'?1.05:1.35)});
 document.getElementById('vRun').setAttribute('aria-pressed',view==='run');document.getElementById('vAll').setAttribute('aria-pressed',view==='all');
 summary();try{history.replaceState(null,'','#seed-'+seed)}catch(e){}
}
function openD(i){const d=list[i],ov=document.getElementById('ov');ov.innerHTML=dossier(d,i);ov.classList.add('on');drawMap(document.getElementById('dm'),d,288,192);paintOtter(document.getElementById('do'),d.archetype,2);document.getElementById('cl').onclick=closeD;ov.scrollTop=0}
function closeD(){document.getElementById('ov').classList.remove('on')}
document.getElementById('grid').addEventListener('click',e=>{const p=e.target.closest('.plate');if(p)openD(+p.dataset.i)});
document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeD()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeD()});
document.getElementById('seed').addEventListener('input',draw);
document.getElementById('roll').onclick=()=>{document.getElementById('seed').value=Math.floor(Math.random()*99999);draw()};
document.getElementById('vRun').onclick=()=>{view='run';draw()};
document.getElementById('vAll').onclick=()=>{view='all';draw()};
try{const m=/^#seed-(\d+)$/.exec(location.hash);if(m)document.getElementById('seed').value=m[1]}catch(e){}
spReady.then(draw);
</script>
