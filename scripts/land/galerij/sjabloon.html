<title>World Gallery</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: control bar, then a grid of world cards: map thumbnail on top, name/family/climate, resources, loot, rule. Industrial dark like the mice. */
:root{color-scheme:dark;--bg:#14161a;--panel:#1c1f25;--line:#2c3038;--fg:#e6e3da;--dim:#8d9099;--neon:#4ef2ff;--warn:#ff9a3c;--chip:#2e333b;--font:'Space Grotesk',system-ui,sans-serif;--mono:ui-monospace,'JetBrains Mono',monospace}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){color-scheme:light;--bg:#ecebe6;--panel:#f8f7f3;--line:#cfccc2;--fg:#1c1e22;--dim:#666a72;--neon:#0a7d8c;--warn:#b85a00;--chip:#e2e0d8}}
:root[data-theme="light"]{color-scheme:light;--bg:#ecebe6;--panel:#f8f7f3;--line:#cfccc2;--fg:#1c1e22;--dim:#666a72;--neon:#0a7d8c;--warn:#b85a00;--chip:#e2e0d8}
body{background:var(--bg);color:var(--fg);font-family:var(--font);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.5rem;margin:0;text-wrap:balance}
.sub{color:var(--dim);margin:4px 0 0;max-width:68ch;line-height:1.5;font-size:.9rem}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding:12px;background:var(--panel);border:1px solid var(--line)}
label{display:flex;flex-direction:column;gap:4px;font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
input{background:var(--bg);color:var(--fg);border:1px solid var(--line);padding:8px 10px;font-family:var(--mono);width:9ch;border-radius:0}
button{background:var(--bg);color:var(--fg);border:1px solid var(--line);padding:8px 14px;font:inherit;cursor:pointer;border-radius:0}
button:hover{border-color:var(--neon)}button[aria-pressed=true]{border-color:var(--neon);color:var(--neon)}
button:focus-visible,input:focus-visible{outline:2px solid var(--neon);outline-offset:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.map{position:relative;aspect-ratio:3/2;background:#000;overflow:hidden}
.map canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.map img{position:absolute;right:6px;bottom:4px;height:56%;image-rendering:pixelated;filter:drop-shadow(0 2px 0 rgba(0,0,0,.5))}
.map .tag{position:absolute;left:6px;top:6px;font:.65rem var(--mono);background:rgba(10,10,10,.7);color:#ddd;padding:2px 6px;letter-spacing:.08em}
.body{padding:12px;display:flex;flex-direction:column;gap:9px}
.name{font-size:1.1rem;font-weight:600;margin:0;overflow-wrap:anywhere}
.meta{font-size:.74rem;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;line-height:1.4}
.k{font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin-bottom:3px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font:.72rem var(--mono);padding:2px 7px;background:var(--chip);border:1px solid var(--line);display:flex;gap:5px;align-items:center}
.chip i{width:8px;height:8px;display:inline-block}
.chip.u{border-color:var(--neon);color:var(--neon);background:transparent}
.loot{font:.72rem/1.5 var(--mono);color:var(--dim)}
.rule{font-size:.78rem;color:var(--warn)}
.wr{height:6px;background:var(--bg);border:1px solid var(--line)}.wr i{display:block;height:100%;background:var(--warn)}
</style>
<div class="wrap">
<div><h1>World Gallery</h1><p class="sub">Twelve dimensions rolled from one seed, side by side. Each map shows the climate ground, water, the disc in the middle with its transport ring, and the native sites with their territory. Judge one thing: do these feel like different places?</p></div>
<div class="bar">
<label for="seed">Seed<input id="seed" inputmode="numeric" value="42"></label>
<button id="roll">Roll new seed</button>
<button id="vRun" aria-pressed="true">12 shifts in a row</button>
<button id="vAll" aria-pressed="false">One of each type</button>
</div>
<div class="grid" id="grid"></div>
</div>

<script>
const {genereerRun,genereerDimensie,ARCHETYPES,DIMENSIES}=LAND;
const hex=n=>'#'+n.toString(16).padStart(6,'0');
const NAME={steentijd:'Stone age',oudheid:'Antiquity',middeleeuwen:'Medieval',industrieel:'Industrial',modern:'Modern',scifi:'Sci-fi',insecten:'Bugs',monsters:'Monsters',kuddes:'Hordes',reuzen:'Giants',aliens:'Aliens',tentakelbeest:'Tentacle beast'};
const FAM={beschaving:'Civilization',wildernis:'Wildlife',bijzonder:'Special'};
const RES={metaal:['metal','#8a9094'],hout:['wood','#9a6a3a'],water:['water','#3a7ab8'],steen:['stone','#b8a888']};
const ALL=Object.keys(NAME);
const CLIM=Object.fromEntries(DIMENSIES.map(d=>[d.tegelset,d]));
let view='run';
// vaste ruis
function mulberry(a){return()=>{a=(a+0x6d2b79f5)>>>0;let t=Math.imul(a^a>>>15,a|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function hash(x,y,s){let h=Math.imul(x*374761393+y*668265263+s*1442695041,2246822519);h^=h>>>13;h=Math.imul(h,3266489917);return((h^h>>>16)>>>0)/4294967296}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 const a=hash(xi,yi,s),b=hash(xi+1,yi,s),c=hash(xi,yi+1,s),d=hash(xi+1,yi+1,s);return(a+(b-a)*u)*(1-v)+(c+(d-c)*u)*v}
const rgb=n=>[(n>>16)&255,(n>>8)&255,n&255];
function drawMap(cv,d){
 const W=96,H=64;cv.width=W;cv.height=H;const g=cv.getContext('2d'),im=g.createImageData(W,H);
 const c=CLIM[d.klimaat],hv=c.heuvels,sc=Math.max(2.5,hv.schaal/ (d.kaart[0]/W)),seed=d.seed&0xffff;
 const grond=c.grond.map(rgb),water=c.water.map(rgb),vlek=rgb(c.vlek);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const n=(vnoise(x/sc,y/sc,seed)*0.7+vnoise(x/(sc/2.3),y/(sc/2.3),seed+9)*0.3);
  let h=(n-0.5)*2*hv.hoog*0.5+hv.basis*0.4; // ruwe hoogte
  const rx=(x-W/2)/ (W/2),ry=(y-H/2)/(H/2),dist=Math.hypot(rx*1.5,ry); if(dist<0.28)h=Math.max(h,0.2);
  let col;
  if(h<-0.5+0.05&&dist>0.3){col=water[(x+y)%water.length]}
  else{col=grond[Math.floor(hash(x,y,seed)*grond.length)%grond.length];const t=0.62+0.38*Math.min(1,Math.max(0,(h+0.5)/4));col=col.map(v=>v*t);
   if(hash(x,y,seed+5)<c.vlekKans)col=vlek}
  const i=(y*W+x)*4;im.data[i]=col[0];im.data[i+1]=col[1];im.data[i+2]=col[2];im.data[i+3]=255}
 g.putImageData(im,0,0);
 // sites: territorium + blokje, weg van de schijf
 const r=mulberry(d.seed);
 for(let k=0;k<d.sites;k++){const a=r()*Math.PI*2,e=0.45+r()*0.5,x=W/2+Math.cos(a)*e*W*0.47,y=H/2+Math.sin(a)*e*H*0.45;
  g.strokeStyle='rgba(255,70,50,.55)';g.lineWidth=1;g.beginPath();g.ellipse(x,y,7,4.6,0,0,7);g.stroke();
  g.fillStyle='#ff4632';g.fillRect(Math.round(x)-1,Math.round(y)-1,3,3)}
 // de schijf met transportring
 g.strokeStyle='#ffd23c';g.setLineDash([2,2]);g.beginPath();g.ellipse(W/2,H/2,9,6,0,0,7);g.stroke();g.setLineDash([]);
 g.fillStyle='#4a4c4a';g.fillRect(W/2-3,H/2-2,6,4);g.fillStyle='#4ef2ff';g.fillRect(W/2-1,H/2-1,2,2);
}
function card(d,i){
 const sh=d.aanbod.filter(a=>RES[a.goed]).map(a=>`<span class="chip"><i style="background:${RES[a.goed][1]}"></i>${RES[a.goed][0]}</span>`).join('');
 const missing=Object.keys(RES).filter(k=>!d.aanbod.some(a=>a.goed===k)).map(k=>`<span class="chip" style="opacity:.4;text-decoration:line-through">${RES[k][0]}</span>`).join('');
 const uq=d.uniek.map(u=>`<span class="chip u">${u.naam}</span>`).join('');
 const spr=SPRITES[d.archetype]?`<img alt="" src="${SPRITES[d.archetype]}">`:'';
 return `<article class="card"><div class="map"><canvas id="m${i}"></canvas>${spr}<span class="tag">SHIFT ${d.nummer} · ${d.klimaat.toUpperCase()} · ${d.kaart[0]}×${d.kaart[1]}</span></div><div class="body">
 <h2 class="name">${d.naam}</h2><div class="meta">${FAM[d.familie]} · ${NAME[d.archetype]} · ${d.sites} native sites</div>
 <div><div class="k">Shared resources</div><div class="chips">${sh}${missing}</div></div>
 <div><div class="k">Only here</div><div class="chips">${uq}</div></div>
 <div><div class="k">Loot plans</div><div class="loot">${d.loot.map(l=>l.vondst).join('<br>')}</div></div>
 ${d.regel?`<div class="rule">Rule: ${d.regel}</div>`:''}
 <div><div class="k">Wrath at landing ${d.beginWrath}</div><div class="wr"><i style="width:${d.beginWrath}%"></i></div></div></div></article>`}
function draw(){
 const seed=parseInt(document.getElementById('seed').value,10)||0;
 const list=view==='run'?genereerRun(seed,12):ALL.map((a,i)=>genereerDimensie(seed,i+1,{archetype:a}));
 document.getElementById('grid').innerHTML=list.map(card).join('');
 list.forEach((d,i)=>drawMap(document.getElementById('m'+i),d));
 document.getElementById('vRun').setAttribute('aria-pressed',view==='run');document.getElementById('vAll').setAttribute('aria-pressed',view==='all');
}
document.getElementById('seed').addEventListener('input',draw);
document.getElementById('roll').onclick=()=>{document.getElementById('seed').value=Math.floor(Math.random()*99999);draw()};
document.getElementById('vRun').onclick=()=>{view='run';draw()};
document.getElementById('vAll').onclick=()=>{view='all';draw()};
draw();
</script>
