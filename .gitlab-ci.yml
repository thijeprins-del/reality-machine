# GitLab CI: check merge requests and publish the site on GitLab Pages (replaces .github/workflows/pages.yml).
#   main -> RELEASE  https://thijeprins.gitlab.io/reality-machine/
#   dev  -> DEV      https://thijeprins.gitlab.io/reality-machine/dev/
# - Every MR to dev or main: job `controle` (npm run snel; to dev also: VERSIE bumped). Red = don't merge.
# - Every push to dev or main: job `pages` builds main and dev and publishes them together (Pages keeps one site per project).
# - Changes that only touch docs (except HELP.md) don't redeploy.

default:
  image: node:22

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"

controle:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main")
  variables:
    GIT_DEPTH: 0
  script:
    # Every MR to dev bumps VERSIE (e.g. v100t -> v101l), see CLAUDE.md "Versie".
    - |
      if [ "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" = dev ]; then
        git fetch -q origin dev
        nieuw=$(tr -d '[:space:]' < VERSIE)
        oud=$(git show "origin/dev:VERSIE" 2>/dev/null | tr -d '[:space:]' || true)
        echo "dev: ${oud:-none}  MR: $nieuw"
        echo "$nieuw" | grep -Eq '^v[0-9]+[tl]$' || { echo "VERSIE must be vNNNt or vNNNl, is '$nieuw'"; exit 1; }
        if echo "$oud" | grep -Eq '^v[0-9]+[tl]$'; then
          n=$(echo "$nieuw" | tr -dc '0-9'); o=$(echo "$oud" | tr -dc '0-9')
          [ "$n" -eq $((o + 1)) ] || { echo "VERSIE must be v$((o + 1))t or v$((o + 1))l (dev is at $oud)"; exit 1; }
        fi
      fi
    # main has no game yet before the first release (no package.json): nothing to check then.
    - if [ -f package-lock.json ]; then npm ci --no-audit --no-fund && npm run snel; fi

pages:
  rules:
    - if: ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main") && $CI_PIPELINE_SOURCE == "push"
      changes: ['**/*', '!**/*.md', 'HELP.md']
    - if: $CI_PIPELINE_SOURCE == "web"
  resource_group: pages
  variables:
    GIT_STRATEGY: none
  script:
    - |
      set -e
      for env in main dev; do
        mkdir -p "bouw/$env"
        if ! git clone -q --depth 1 --branch "$env" "$CI_REPOSITORY_URL" "src-$env"; then
          echo "$env: branch does not exist, skipped"; continue
        fi
        sha=$(git -C "src-$env" rev-parse HEAD)
        if [ -f "src-$env/package.json" ]; then
          (cd "src-$env" && npm ci --no-audit --no-fund && GAME_ENV=$([ "$env" = main ] || echo "$env") COMMIT="$sha" BUILD_NUMBER="$CI_PIPELINE_IID" npm run build)
          cp -r "src-$env/dist/." "bouw/$env/"
        else
          # No game on this branch yet (e.g. main before the first release).
          printf '<!doctype html><meta charset="utf-8"><title>Reality Machine</title><p>Reality Machine: coming soon. <a href="./dev/">To DEV</a></p>\n' > "bouw/$env/index.html"
          touch "bouw/$env/.binnenkort"
        fi
        echo "$env: $(cat "src-$env/VERSIE" 2>/dev/null || echo '?') build $CI_PIPELINE_IID (${sha:0:7})" > "bouw/$env/versie.txt"
      done
      mkdir -p public
      cp -r bouw/main/. public/
      mkdir -p public/dev && cp -r bouw/dev/. public/dev/
      # No game on main yet: the RELEASE page becomes the teaser from the dev build (teaser/index.html),
      # with paths rewritten from /dev/teaser/ to the root. The teaser itself also stays at /dev/teaser/.
      if [ -f bouw/main/.binnenkort ] && [ -f bouw/dev/teaser/index.html ]; then
        sed -e 's#"\.\./assets/#"dev/assets/#g' -e 's#href="favicon.svg"#href="dev/teaser/favicon.svg"#' \
          bouw/dev/teaser/index.html > public/index.html
        rm -f public/.binnenkort
      fi
      cat bouw/*/versie.txt | tee public/versies.txt
      rm -f public/versie.txt public/*/versie.txt public/*/.binnenkort
  artifacts:
    paths: [public]
