<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reality Machine</title>
    <style>
      html, body { margin: 0; height: 100%; background: #10131c; overflow: hidden; }
      #versie { position: fixed; right: 8px; bottom: 6px; font: 12px monospace; color: #8a93a8; }
      #menu { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #07080a; color: #c8ccd2; font-family: monospace; }
      #menu h1 { font-size: 40px; letter-spacing: 4px; margin: 0 0 8px; color: #e8ecf4; }
      #menu p { color: #8a8f94; margin: 0 0 28px; }
      #menu .keuzes { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; padding: 0 16px; }
      #menu button { width: 240px; padding: 18px; background: #15171a; border: 1px solid #3d4143; color: #e8ecf4;
        font-family: monospace; text-align: left; cursor: pointer; border-radius: 0; }
      #menu button:hover:not(:disabled) { border-color: #9dff2e; box-shadow: 0 0 12px #9dff2e55; }
      #menu button:disabled { color: #5e6261; cursor: default; }
      #menu button b { display: block; font-size: 20px; margin-bottom: 6px; }
      #menu button span { font-size: 12px; color: #8a8f94; }
      #balk { position: fixed; left: 0; top: 0; padding: 10px 14px; font: 14px monospace; color: #c8ccd2;
        background: #07080acc; border-right: 1px solid #25292b; border-bottom: 1px solid #25292b; pointer-events: none; }
      #balk div { line-height: 1.6; }
      #terreinpaneel { position: fixed; right: 8px; top: 8px; width: 214px; padding: 8px 10px; z-index: 5; font: 12px monospace; color: #c8ccd2;
        background: #07080ae6; border: 1px solid #3d4143; }
      #terreinpaneel .rij { margin-top: 6px; }
      #terreinpaneel button { font: 12px monospace; padding: 3px 7px; margin-right: 3px; background: #15171a; color: #c8ccd2;
        border: 1px solid #3d4143; border-radius: 0; cursor: pointer; }
      #terreinpaneel button.aan { border-color: #9dff2e; color: #9dff2e; }
      #terreinpaneel p { margin: 8px 0 0; color: #8a8f94; line-height: 1.35; }
      #hulp { position: fixed; left: 8px; bottom: 6px; font: 12px monospace; color: #5e6261; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="versie"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
