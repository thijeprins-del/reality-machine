<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Reality Machine</title>
    <style>
      html, body { margin: 0; height: 100%; background: #10131c; overflow: hidden; }
      #versie { position: fixed; right: 8px; bottom: 6px; z-index: 20; font: 12px monospace; color: #8a93a8; pointer-events: none; }
      #balk { z-index: 3; position: fixed; left: 0; top: 0; padding: 10px 14px; font: 14px monospace; color: #c8ccd2;
        background: #07080acc; border-right: 1px solid #25292b; border-bottom: 1px solid #25292b; pointer-events: none; }
      #shiftknop { position: fixed; top: 8px; z-index: 6; font: 14px monospace; padding: 4px 10px; background: #15171a; color: #9dff2e;
        border: 1px solid #9dff2e; border-radius: 0; cursor: pointer; }
      #shiftknop.nietklaar { color: #ff9a1f; border-color: #ff9a1f; }
      #shiftknop:disabled { opacity: .4; cursor: default; }
      #balk div { line-height: 1.6; }
      #terreinpaneel { position: fixed; right: 8px; top: 8px; width: 214px; padding: 8px 10px; z-index: 5; font: 12px monospace; color: #c8ccd2;
        background: #07080ae6; border: 1px solid #3d4143; }
      #terreinpaneel .rij { margin-top: 6px; }
      #terreinpaneel button { font: 12px monospace; padding: 3px 7px; margin-right: 3px; background: #15171a; color: #c8ccd2;
        border: 1px solid #3d4143; border-radius: 0; cursor: pointer; }
      #terreinpaneel button.aan { border-color: #9dff2e; color: #9dff2e; }
      #terreinpaneel p { margin: 8px 0 0; color: #8a8f94; line-height: 1.35; }
      #knoppen { position: fixed; right: 8px; bottom: 26px; z-index: 6; display: flex; gap: 6px; }
      #knoppen button { min-width: 44px; height: 40px; padding: 0 10px; font: bold 13px monospace; color: #c8ccd2; background: #07080ae6;
        border: 1px solid #3d4143; border-radius: 0; touch-action: manipulation; }
      #knoppen button.aan { border-color: #9dff2e; color: #9dff2e; box-shadow: 0 0 8px #9dff2e55; }
      @media (max-width: 999px), (max-height: 639px) {
        #balk { font-size: 11px; padding: 5px 8px; }
        #hud { font-size: 11px; max-width: 92vw; bottom: 20px; }
        #bouw { width: 248px; max-height: calc(100vh - 56px); font-size: 11px; }
        #bouw .kaarten { grid-template-columns: repeat(2, 1fr); }
        .dialoog .inhoud { font-size: 12px; }
        #versie { font-size: 10px; right: auto; left: 8px; bottom: 4px; }
      }
      /* De balk linksonder: voorraad, stroom, RATS en LOG (inklapbaar) en de knoppen voor de dialogen. */
      #hud { position: fixed; left: 6px; bottom: 6px; z-index: 6; max-width: 460px; padding: 6px 8px; font: 13px monospace; color: #c8ccd2;
        background: #07080ae6; border: 1px solid #3d4143; user-select: none; }
      #hud > div + div { margin-top: 5px; }
      #hud .inv { display: flex; flex-wrap: wrap; gap: 3px 10px; align-items: center; }
      #hud .item { display: inline-flex; align-items: center; gap: 4px; color: #ffe08a; }
      .ico { display: inline-block; width: 10px; height: 10px; image-rendering: pixelated; border: 1px solid #050505; flex: 0 0 auto; }
      .ico.gloeit { box-shadow: 0 0 6px currentColor; }
      .ico.plaatje { width: 28px; height: 24px; border: 0; margin: -4px 0; }
      #hud .opslag { margin-left: auto; color: #8d9189; }
      #hud .opslag.vol { color: #ff2a3a; }
      #hud .stil { color: #5e6261; }
      #hud .stroom { color: #8d9189; }
      #hud .stroom b { margin-right: 10px; }
      #hud .aanbod { color: #9dff2e; }
      #hud .vraag { color: #ff9a1f; }
      #hud .tekort { color: #ff2a3a; }
      #hud button { font: inherit; color: #c8ccd2; background: #15171a; border: 1px solid #3d4143; border-radius: 0; cursor: pointer; }
      #hud .kopje { display: block; width: 100%; padding: 2px 4px; text-align: left; background: none; border: 0; color: #a8861c;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #hud .kopje:hover { color: #ffd23f; }
      #hud .kort { color: #8d9189; }
      #hud .lijf { padding: 2px 4px 2px 16px; font-size: 12px; }
      #hud .rij { display: flex; gap: 8px; align-items: center; color: #8d9189; }
      #hud .rij span:first-child { width: 96px; }
      #hud .rij b { width: 22px; text-align: right; color: #c8ccd2; }
      #hud .staaf { flex: 1; height: 5px; background: #050505; }
      #hud .staaf i { display: block; height: 100%; background: #9dff2e; }
      #hud .oud { color: #6b4a14; }
      .log-amber { color: #ff9a1f; } .log-rood { color: #ff2a3a; } .log-groen { color: #9dff2e; } .log-cyaan { color: #4ef2ff; }
      #hud .knoppen { display: flex; gap: 6px; }
      #hud .knoppen button { flex: 1; padding: 6px 8px; font-weight: bold; touch-action: manipulation; }
      #hud .knoppen button:hover { border-color: #8d9189; }
      #hud .knoppen button.aan { border-color: #9dff2e; color: #9dff2e; }
      /* Het bouwmenu rechts: kaarten per gebouw, details van het aangewezen gebouw, het aangeklikte gebouw. */
      #bouw { position: fixed; right: 0; top: 0; z-index: 5; width: 312px; max-width: 92vw; max-height: 100vh; box-sizing: border-box; overflow-y: auto;
        padding: 8px 8px 10px 12px; font: 12px monospace; color: #c8ccd2; background: #0b0c0cf0; border-left: 1px solid #353837;
        border-bottom: 1px solid #353837; user-select: none; scrollbar-width: thin; scrollbar-color: #3d4143 #0b0c0c;
        background-image: repeating-linear-gradient(#5a4a12 0 3px, #0a0a0a 3px 6px); background-size: 3px 100%; background-repeat: no-repeat; }
      #bouw [hidden] { display: none !important; }
      #bouw .kop { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; margin-bottom: 6px; }
      #bouw .kop b { color: #a8861c; letter-spacing: 2px; font-size: 14px; }
      #bouw .eco { color: #c8ccd2; text-transform: uppercase; }
      #bouw .bestand { color: #5e6261; font-size: 11px; }
      #bouw .opslag { margin-left: auto; color: #8d9189; font-size: 11px; }
      #bouw .opslag.vol { color: #ff2a3a; }
      #bouw .kaarten { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
      #bouw .kaart { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; padding: 4px 3px 5px;
        font: inherit; color: #e8e4d4; background: #121413; border: 1px solid #25292b; border-radius: 0; cursor: pointer; text-align: center; }
      #bouw .kaart:hover { border-color: #8d9189; background: #1a1c1b; }
      #bouw .kaart.aan { border-color: #9dff2e; background: #1d2a14; box-shadow: 0 0 8px #9dff2e44; }
      #bouw .kaart.duur .beeld { opacity: .45; }
      #bouw .kaart .toets { position: absolute; left: 3px; top: 2px; padding: 0 3px; font-weight: bold; color: #0b0c0c; background: #a8861c; }
      #bouw .kaart .beeld { display: flex; align-items: flex-end; justify-content: center; width: 100%; height: 62px; }
      #bouw .kaart .beeld img { max-width: 100%; max-height: 62px; image-rendering: pixelated; }
      #bouw .kaart .beeld i { width: 36px; height: 36px; border: 1px solid #050505; }
      #bouw .kaart .beeld b { font-size: 34px; line-height: 56px; color: #ff9a1f; }
      #bouw .kaart .naam { width: 100%; font-size: 11px; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #bouw .kaart.aan .naam { color: #9dff2e; }
      #bouw .kost, #bouw .lijst { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 1px 6px; }
      #bouw .lijst { justify-content: flex-start; }
      #bouw .lijst.kolom { flex-direction: column; align-items: flex-start; gap: 3px; }
      #bouw .stuk { display: inline-flex; align-items: center; gap: 2px; color: #9dff2e; white-space: nowrap; }
      #bouw .stuk .ico.plaatje { width: 21px; height: 18px; margin: 0; }
      #bouw .stuk.tekort { color: #ff2a3a; }
      #bouw .stuk.gratis, #bouw .per { color: #5e6261; font-size: 11px; }
      #bouw .stuk small { margin-left: 3px; color: #5e6261; font-size: 10px; }
      #bouw .recept .stuk, #bouw .gekozen .stuk { color: #ffe08a; }
      #bouw .pijl { color: #8d9189; margin: 0 2px; }
      #bouw .tijd { margin-left: 6px; color: #5e6261; }
      #bouw .kw { color: #ffd23f; font-weight: bold; }
      #bouw .recept { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 1px 4px; }
      #bouw .packs { display: inline-flex; align-items: center; gap: 3px; color: #4ef2ff; }
      #bouw .packs .ico.plaatje { width: 21px; height: 18px; margin: 0; }
      #bouw .opslag { margin-left: 0; }
      #bouw .kaart.slot { background: #0d0e0e; border-style: dashed; }
      #bouw .kaart.slot .beeld { opacity: .3; filter: grayscale(1); }
      #bouw .kaart.slot .naam { color: #5e6261; }
      #bouw .tier { padding: 0 3px; font-size: 10px; color: #0b0c0c; background: #4ef2ff; }
      #bouw .kaart .tier { position: absolute; right: 3px; top: 2px; }
      #bouw .kaart.slot .tier { background: #ff9a1f; }
      #bouw .slotbalk { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin: 6px 0; padding: 5px 6px; background: #050505;
        border: 1px dashed #ff9a1f; color: #ff9a1f; }
      #bouw .slotbalk small { flex-basis: 100%; color: #ff2a3a; }
      #bouw .slotbalk button, #bouw .knoppen button.slot { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; font: inherit; font-weight: bold;
        color: #0b0c0c; background: #4ef2ff; border: 1px solid #4ef2ff; border-radius: 0; cursor: pointer; }
      #bouw .slotbalk button .ico.plaatje, #bouw .prijs .ico.plaatje { width: 21px; height: 18px; margin: 0; }
      #bouw .slotbalk button.nee { color: #8d9189; background: #15171a; border-color: #3d4143; cursor: default; }
      #bouw .knoppen button.slot { flex-wrap: wrap; font-weight: normal; color: #8d9189; background: #0d0e0e; border: 1px dashed #3d4143; }
      #bouw .knoppen button.slot.kan { border-color: #4ef2ff; }
      #bouw .knoppen button.slot .stuk { color: #8d9189; }
      #bouw .prijs { display: inline-flex; align-items: center; gap: 3px; margin-left: auto; color: #ff9a1f; }
      #bouw .knoppen button.slot.kan .prijs { color: #4ef2ff; }
      #bouw .recept.slot { opacity: .6; }
      #bouw .melding { margin-top: 6px; padding: 4px 6px; background: #050505; line-height: 1.3; }
      #bouw .melding .ok { color: #9dff2e; } #bouw .melding .fout { color: #ff2a3a; }
      #bouw .detail, #bouw .gekozen .vast { margin-top: 8px; padding-top: 6px; border-top: 1px solid #353837; }
      #bouw .titel { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
      #bouw .titel b { color: #4ef2ff; font-size: 13px; letter-spacing: 1px; }
      #bouw .soort { color: #a8861c; font-size: 10px; letter-spacing: 1px; }
      #bouw .boven { display: flex; gap: 8px; align-items: flex-end; margin: 4px 0; }
      #bouw .boven .groot { flex: 0 0 auto; max-width: 112px; max-height: 120px; image-rendering: pixelated; }
      #bouw p { margin: 4px 0; color: #8d9189; line-height: 1.35; }
      #bouw p.tip { color: #a8861c; font-size: 11px; }
      #bouw .feiten { display: flex; flex-wrap: wrap; gap: 3px; margin: 4px 0; }
      #bouw .feiten span { padding: 1px 5px; color: #c8ccd2; background: #15171a; border: 1px solid #25292b; white-space: nowrap; }
      #bouw i { font-style: normal; }
      #bouw .feiten i, #bouw .rij > i { margin-right: 5px; color: #a8861c; font-size: 10px; letter-spacing: 1px; }
      #bouw .rij { display: flex; gap: 4px; align-items: flex-start; margin: 5px 0; }
      #bouw .rij > i { flex: 0 0 62px; padding-top: 3px; }
      #bouw .knoppen { display: flex; flex-wrap: wrap; gap: 4px; margin: 5px 0; }
      #bouw .knoppen.kolom { flex-direction: column; }
      #bouw .knoppen button { display: inline-flex; align-items: center; gap: 4px; padding: 3px 6px; font: inherit; color: #e8e4d4; background: #121413;
        border: 1px solid #25292b; border-radius: 0; cursor: pointer; text-align: left; }
      #bouw .knoppen button:hover { border-color: #8d9189; }
      #bouw .knoppen button.aan { border-color: #9dff2e; background: #1d2a14; }
      #bouw .stil { color: #5e6261; }
      #bouw .draait { color: #9dff2e; } #bouw .geblokt { color: #ff2a3a; } #bouw .bouwt { color: #ffd23f; }
      #bouw .balk { height: 5px; background: #050505; }
      #bouw .balk i { display: block; height: 100%; background: #4ef2ff; }
      /* Dialogen: midden in beeld, één tegelijk. */
      .dialoog { display: none; position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 30; flex-direction: column;
        max-width: 96vw; max-height: 90vh; font: 13px monospace; color: #c8ccd2; background: #0b0c0c; border: 1px solid #5a4a12;
        box-shadow: 0 0 0 9999px #0006; }
      .dialoog .kop { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px 6px 10px; color: #a8861c;
        border-bottom: 1px solid #353837; letter-spacing: 1px; }
      .dialoog .kop button { width: 26px; height: 22px; font: bold 12px monospace; color: #c8ccd2; background: #15171a; border: 1px solid #3d4143;
        border-radius: 0; cursor: pointer; }
      .dialoog .kop button:hover { border-color: #ff2a3a; color: #ff2a3a; }
      .dialoog .inhoud { padding: 10px 14px; overflow: auto; }
      .dialoog h3 { margin: 10px 0 4px; font-size: 12px; color: #a8861c; letter-spacing: 1px; text-transform: uppercase; }
      .dialoog h3:first-child { margin-top: 0; }
      .dialoog table { border-collapse: collapse; }
      .dialoog th { padding: 2px 18px 2px 0; text-align: left; font-weight: normal; color: #ffe08a; white-space: nowrap; }
      .dialoog td { padding: 2px 0; color: #8d9189; }
      .dialoog p { margin: 10px 0 0; max-width: 420px; color: #5e6261; line-height: 1.4; }
      .productie td, .productie th { padding: 3px 14px 3px 0; }
      .productie thead td, .productie thead th { color: #a8861c; border-bottom: 1px solid #353837; }
      .productie .getal { text-align: right; color: #c8ccd2; }
      .productie .leeg th, .productie .leeg .getal { color: #5e6261; }
      .productie .getal.plus { color: #9dff2e; } .productie .getal.min { color: #ff2a3a; } .productie .getal.nul { color: #5e6261; }
      /* Tooltip bij de muis. */
      #tip { display: none; position: fixed; z-index: 40; max-width: 300px; padding: 5px 8px; font: 12px monospace; line-height: 1.35; color: #4ef2ff;
        background: #07080af2; border: 1px solid #25506a; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="versie"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
